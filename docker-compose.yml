name: school-management

services:
  # ============================================================================
  # 1. MONGODB 7.0 (Chế độ Replica Set 1-node `rs0` hỗ trợ ACID Transactions)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: school-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { const s = rs.status(); if (s.ok === 1 && s.members.some(m => m.stateStr === 'PRIMARY')) quit(0); quit(1); } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }); quit(1); }"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - school-net

  # ============================================================================
  # 2. BACKEND HỢP NHẤT (Tự nạp `backend/.env` hoặc fallback `backend/.env.example`)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: school-management-fullstack:latest
    container_name: school-backend
    init: true
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./backend/.env.example
        required: false
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      RUNNING_IN_DOCKER: "true"
      PORT: 5000
      HOST: 0.0.0.0
      FRONTEND_DIST_PATH: /app/public
    ports:
      - "5001:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - school-net

volumes:
  mongo_data:
  mongo_config:
  backend_uploads:

networks:
  school-net:
    driver: bridge
