server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Đồng bộ giới hạn tải lên với Backend (JSON 15MB, minh chứng bằng cấp 10MB, Excel 5MB)
    client_max_body_size 20M;

    # Nén Gzip tăng tốc độ tải tài nguyên tĩnh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Header bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint kiểm tra sức khỏe nội bộ cho Docker HEALTHCHECK
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Reverse Proxy toàn bộ API sang Backend container (giữ nguyên URI gốc và mã hóa tiếng Việt)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Bộ nhớ đệm dài hạn cho các bundle Vite có mã băm (hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hỗ trợ điều hướng SPA (React Router v7) — luôn trả về index.html khi F5 trên các đường dẫn con
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

